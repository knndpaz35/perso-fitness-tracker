<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LIFT — Workout Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── THEME VARIABLES ─────────────────────────────────── */
:root {
  --accent: #f0ff44;
  --accent2: #ff4d6d;
  --accent3: #00e5ff;
  --push: #ff4d6d;
  --pull: #00e5ff;
  --legs: #00ff94;
  --upper: #bf6bff;
  --lower: #ff9500;
}
[data-theme="dark"] {
  --bg:       #0c0c0e;
  --bg2:      #141416;
  --bg3:      #1c1c20;
  --surface:  #1a1a1f;
  --surface2: #222228;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.13);
  --ink:      #f0f0f5;
  --ink2:     #8888a0;
  --ink3:     #44445a;
  --glow:     rgba(240,255,68,0.15);
}
[data-theme="light"] {
  --bg:       #f0f0ee;
  --bg2:      #e4e4e0;
  --bg3:      #d8d8d4;
  --surface:  #ffffff;
  --surface2: #f8f8f5;
  --border:   rgba(0,0,0,0.08);
  --border2:  rgba(0,0,0,0.14);
  --ink:      #111114;
  --ink2:     #55555e;
  --ink3:     #aaaaaa;
  --glow:     rgba(240,255,68,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
}

/* ── TOPBAR ──────────────────────────────────────────── */
.topbar {
  flex-shrink: 0;
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
  position: relative;
}
.topbar::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
  opacity: 0.6;
}
.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 26px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink);
}
.logo span { color: var(--accent); }
.topbar-right { display: flex; align-items: center; gap: 8px; }

/* INLINE UNIT SELECT inside weight input */
.weight-wrap { position: relative; display: flex; align-items: stretch; }
.weight-wrap .set-inp { padding-right: 48px; width: 100%; border-radius: 7px; }
.unit-sel {
  position: absolute; right: 0; top: 0; bottom: 0; width: 44px;
  background: var(--bg3); border: none; border-left: 1px solid var(--border2);
  border-radius: 0 7px 7px 0; color: var(--ink2);
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 600;
  cursor: pointer; outline: none; -webkit-appearance: none; appearance: none;
  letter-spacing: 0.3px; text-align: center; text-align-last: center;
  transition: color 0.15s;
}
.unit-sel:focus, .unit-sel:hover { color: var(--accent); background: var(--bg3); }

/* THEME TOGGLE */
.theme-btn {
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.theme-btn:hover { background: var(--bg3); }

/* NAV */
.nav { display: flex; gap: 2px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; padding: 3px; }
.nb {
  padding: 5px 12px;
  border-radius: 5px;
  border: none;
  background: transparent;
  color: var(--ink2);
  font-family: 'Barlow', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.3px;
  transition: all 0.15s;
}
.nb.active { background: var(--surface); color: var(--ink); }
.nb:hover:not(.active) { color: var(--ink); }

/* ── PAGES ───────────────────────────────────────────── */
.pages { flex: 1; overflow: hidden; position: relative; }
.page { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 20px 16px 100px; display: none; }
.page.active { display: block; }

/* ── DAY SLIDER ──────────────────────────────────────── */
.slider-wrap { margin-bottom: 20px; }
.slider-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink3);
  margin-bottom: 10px;
}
.day-slider {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.day-slider::-webkit-scrollbar { display: none; }
.day-card {
  flex-shrink: 0;
  width: 120px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  padding: 12px;
  scroll-snap-align: start;
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
  overflow: hidden;
}
.day-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--split-color, var(--border));
  transition: all 0.2s;
}
.day-card.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 4px 20px var(--glow); }
.day-card.is-today::before { background: var(--accent); }
.day-card.is-done { border-color: rgba(0,255,148,0.3); }
.day-card.is-done::before { background: var(--legs); }
.day-card.is-missed { border-color: rgba(255,77,109,0.2); }
.day-card:active { transform: scale(0.96); }
.dc-day { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.dc-name { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.2; margin-bottom: 6px; }
.dc-status { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; }
.dc-today-badge {
  position: absolute; top: 8px; right: 8px;
  background: var(--accent); color: #0c0c0e;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; font-weight: 900;
  padding: 1px 5px; border-radius: 3px;
  letter-spacing: 1px; text-transform: uppercase;
}

/* ── SPLIT OVERRIDE ──────────────────────────────────── */
.override-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.override-txt { font-size: 13px; color: var(--ink2); }
.override-txt strong { color: var(--ink); }
.split-sel {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--ink);
  font-family: 'Barlow', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 10px;
  outline: none;
  cursor: pointer;
}
.split-sel:focus { border-color: var(--accent); }

/* ── SUGGEST BOX ─────────────────────────────────────── */
.suggest {
  background: linear-gradient(135deg, rgba(255,149,0,0.08), rgba(255,77,109,0.06));
  border: 1px solid rgba(255,149,0,0.25);
  border-radius: 12px;
  padding: 14px 15px;
  margin-bottom: 18px;
  display: none;
}
.suggest.show { display: block; }
.sug-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sug-icon { font-size: 18px; }
.sug-ttl { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; color: var(--lower); text-transform: uppercase; letter-spacing: 1px; }
.sug-body { font-size: 13px; color: var(--ink2); line-height: 1.55; }
.sug-action { margin-top: 10px; }

/* ── STATS ───────────────────────────────────────────── */
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 20px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 13px;
  position: relative;
  overflow: hidden;
}
.stat-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent-line, var(--border));
}
.stat-v {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
  color: var(--ink);
  letter-spacing: -0.5px;
}
.stat-l { font-size: 11px; color: var(--ink3); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }

/* ── SECTION HEADER ──────────────────────────────────── */
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sec-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink);
}
.prog-row { display: flex; align-items: center; gap: 8px; }
.prog-bg { width: 80px; height: 4px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.4s; }
.prog-pct { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink3); }

/* ── EXERCISE CARDS ──────────────────────────────────── */
.ex-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
}
.ex-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px;
  height: 100%;
  background: var(--split-c, var(--border));
  border-radius: 0 2px 2px 0;
}
.ex-card.done { border-color: rgba(0,255,148,0.25); }
.ex-card.done::before { background: var(--legs); }
.ex-card.open { box-shadow: 0 4px 24px rgba(0,0,0,0.15); border-color: var(--border2); }
.ex-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px 14px 20px;
  cursor: pointer;
  user-select: none;
}
.ex-chk {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--border2);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: transparent;
  transition: all 0.2s;
}
.ex-chk.done { background: var(--legs); border-color: var(--legs); color: #0c0c0e; }
.ex-info { flex: 1; min-width: 0; }
.ex-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ex-meta { font-size: 12px; color: var(--ink3); margin-top: 2px; font-weight: 500; }
.ex-chev { font-size: 14px; color: var(--ink3); transition: transform 0.2s; flex-shrink: 0; }
.ex-card.open .ex-chev { transform: rotate(90deg); }

.ex-body { display: none; border-top: 1px solid var(--border); }
.ex-card.open .ex-body { display: block; }

/* TABS inside card */
.ex-tabs { display: flex; border-bottom: 1px solid var(--border); }
.ex-tab {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  font-family: 'Barlow', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink3);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.15s;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.ex-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.ex-tab-pane { display: none; padding: 14px 16px; }
.ex-tab-pane.active { display: block; }

/* HOW-TO */
.howto-def {
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.7;
  background: var(--bg2);
  border-radius: 8px;
  padding: 12px 14px;
  border-left: 3px solid var(--accent);
  margin-bottom: 12px;
}

/* YOUTUBE EMBED */
.yt-wrap {
  border-radius: 10px;
  overflow: hidden;
  background: #000;
  position: relative;
  aspect-ratio: 16/9;
  cursor: pointer;
  margin-bottom: 10px;
}
.yt-thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.2s;
}
.yt-play-btn {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.35);
  transition: background 0.2s;
}
.yt-wrap:hover .yt-play-btn { background: rgba(0,0,0,0.2); }
.yt-play-icon {
  width: 52px; height: 52px;
  background: #ff0000;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(255,0,0,0.4);
}
.yt-play-icon svg { margin-left: 4px; }
.yt-iframe { width: 100%; height: 100%; border: none; display: block; }
.yt-label { font-size: 11px; color: var(--ink3); margin-top: 6px; font-family: 'DM Mono', monospace; }

/* LOG PANE */
.last-ref {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 12px;
  display: none;
}
.last-ref.show { display: block; }
.ref-lbl { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.ref-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.ref-pill {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 3px 9px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--ink2);
}
.sets-hd { display: grid; grid-template-columns: 28px 1fr 1fr; gap: 6px; margin-bottom: 6px; }
.shd { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.5px; }
.set-row { display: grid; grid-template-columns: 28px 1fr 1fr; gap: 6px; margin-bottom: 7px; align-items: center; }
.set-n {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  text-align: center;
}
.set-inp {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 7px;
  color: var(--ink);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  padding: 8px 8px;
  width: 100%;
  outline: none;
  transition: border-color 0.15s;
  text-align: center;
}
.set-inp:focus { border-color: var(--accent); background: var(--surface); }
.set-inp::placeholder { color: var(--ink3); }
.add-set {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  border: 1.5px dashed var(--border2);
  background: transparent;
  border-radius: 7px;
  font-size: 12px;
  color: var(--ink3);
  cursor: pointer;
  font-family: 'Barlow', sans-serif;
  font-weight: 600;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.add-set:hover { border-color: var(--accent); color: var(--accent); }
.fail-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 12px;
  background: var(--bg2);
  border-radius: 8px;
  border: 1px dashed rgba(255,77,109,0.3);
}
.fail-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent2); cursor: pointer; }
.fail-lbl { font-size: 12px; color: var(--ink2); }
.fail-lbl strong { color: var(--accent2); }
.fb-sect { margin-top: 14px; }
.fb-lbl { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }
.fb-row { display: flex; gap: 6px; }
.fb-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: transparent;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Barlow', sans-serif;
  color: var(--ink2);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.fb-btn:hover { background: var(--bg2); }
.fb-easy.sel { background: rgba(0,255,148,0.1); border-color: var(--legs); color: var(--legs); }
.fb-ok.sel { background: rgba(0,229,255,0.1); border-color: var(--pull); color: var(--pull); }
.fb-hard.sel { background: rgba(255,77,109,0.1); border-color: var(--push); color: var(--push); }

/* ── CALENDAR ────────────────────────────────────────── */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-month {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.cal-navbtns { display: flex; gap: 6px; }
.cnb {
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.cnb:hover { background: var(--bg3); }
.cal-head { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-bottom: 4px; }
.cdh { text-align: center; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink3); padding: 3px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-cell {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  padding: 2px;
  position: relative;
}
.cal-cell:hover:not(.empty) { background: var(--surface2); border-color: var(--border2); }
.cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
.cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cal-cell.done { background: rgba(0,255,148,0.06); border-color: rgba(0,255,148,0.25); }
.cal-cell.missed { background: rgba(255,77,109,0.04); border-color: rgba(255,77,109,0.18); }
.cnum { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(11px,2.5vw,16px); font-weight: 700; line-height: 1; }
.cdot { width: 5px; height: 5px; border-radius: 50%; margin-top: 2px; }
.cslbl { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2px; display: none; }
@media(min-width:400px){ .cslbl { display: block; } }
.cal-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink3); font-weight: 500; }
.ldot { width: 7px; height: 7px; border-radius: 50%; }

/* ── DAY MODAL ───────────────────────────────────────── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
}
@media(min-width:600px){ .modal-bg { align-items: center; padding: 20px; } }
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  width: 100%; max-width: 580px;
  max-height: 88vh; overflow-y: auto;
  animation: su 0.22s ease;
}
@media(min-width:600px){ .modal { border-radius: 20px; } }
@keyframes su { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
.mh { padding: 18px 18px 0; display: flex; align-items: flex-start; justify-content: space-between; }
.mh-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
.mcl {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; width: 32px; height: 32px;
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink2); transition: background 0.15s;
}
.mcl:hover { background: var(--bg3); color: var(--ink); }
.mbody { padding: 14px 18px 24px; }
.dm-ex { padding: 10px 0; border-bottom: 1px solid var(--border); }
.dm-ex:last-child { border-bottom: none; }

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15enh0b2JlampoanJhZXN5d25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODQ4NzEsImV4cCI6MjA5NDE2MDg3MX0.JtBEYjmXPZf6CcnE13wl13AMvC0QMT98KrIfzS071HU';

function initState() {
  // Brand new user — start from today as Push Day (Day 1)
  return {
    startDate: ds(new Date()),
    logs: {}, streak: 0, sessions: 0, prs: {},
    unit: 'kg', theme: 'dark',
    todayOverride: null, lastOverrideDate: null,
    exUnits: {}
  };
}

function normalizeState(s) {
  if (!s || typeof s !== 'object') return initState();
  if (!s.startDate) s.startDate = ds(new Date());
  if (!s.logs) s.logs = {};
  if (typeof s.streak !== 'number') s.streak = 0;
  if (typeof s.sessions !== 'number') s.sessions = 0;
  if (!s.prs) s.prs = {};
  if (!s.unit) s.unit = 'kg';
  if (!s.theme) s.theme = 'dark';
  if (!('todayOverride' in s)) s.todayOverride = null;
  if (!('lastOverrideDate' in s)) s.lastOverrideDate = null;
  if (!s.exUnits) s.exUnits = {};
  // Ensure startDate is never in the future (guards against clock issues)
  if (s.startDate > ds(new Date())) s.startDate = ds(new Date());
  return s;
}

// Save — writes to localStorage instantly, syncs to Supabase in background
async function saveState() {
  try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch(e) {}
  showSyncStatus('syncing');
  try {
    const payload = { user_id: USER_ID, data: ST };
    const res = await fetch(`${SUPABASE_URL}/rest/v1/workout_logs`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const err = await res.text();
      console.warn('Supabase save error:', res.status, err);
      showSyncStatus('error');
    } else {
      showSyncStatus('ok');
    }
  } catch(e) {
    console.warn('Supabase sync failed - saved locally:', e.message);
    showSyncStatus('offline');
  }
}

// Load — fetches from Supabase, falls back to localStorage if offline
async function loadState() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/workout_logs?user_id=eq.${USER_ID}&select=data`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      }
    );
    const rows = await res.json();
    if (rows.length > 0) {
      // Handle data being stored as a JSON string OR as a proper object
      let raw = rows[0].data;
      if (typeof raw === 'string') {
        try { raw = JSON.parse(raw); } catch(e) {}
      }
      const s = normalizeState(raw);
      localStorage.setItem(KEY, JSON.stringify(s));
      return s;
    }
  } catch(e) { console.log('Could not reach Supabase - using local data'); }

  // Fallback to localStorage
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return normalizeState(JSON.parse(raw));
  } catch(e) {}

  return initState();
}

let ST = {};

function ds(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function today() { return ds(new Date()); }
function parseLocalDate(dateStr) {
  // Parse YYYY-MM-DD as LOCAL midnight, not UTC midnight
  // This prevents timezone offset from shifting the date by 1 day
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function dayIdx(dateStr) {
  const ms = parseLocalDate(dateStr) - parseLocalDate(ST.startDate);
  const diff = Math.floor(ms / 86400000);
  return ((diff % 7) + 7) % 7;
}
function getSplit(dateStr) {
  if (dateStr === today() && ST.todayOverride) return ST.todayOverride;
  return CYCLE[dayIdx(dateStr)];
}
function getLog(dateStr) {
  if (!ST.logs[dateStr]) ST.logs[dateStr] = { exercises: {}, completed: false };
  return ST.logs[dateStr];
}
function getExLog(dateStr, id) {
  const l = getLog(dateStr);
  if (!l.exercises[id]) l.exercises[id] = { sets: [], feedback: null, done: false, failure: false };
  return l.exercises[id];
}

// ── UNIT HELPERS ──────────────────────────────────────
function unitLabel() { return ST.unit; }
function toDisplay(kg) {
  if (kg === '' || kg === null || kg === undefined) return '';
  return ST.unit === 'lbs' ? Math.round(parseFloat(kg) * 2.20462 * 10) / 10 : parseFloat(kg);
}
function toKg(val) {
  if (val === '' || val === null || val === undefined) return '';
  return ST.unit === 'lbs' ? Math.round(parseFloat(val) / 2.20462 * 100) / 100 : parseFloat(val);
}
function setUnit(u, exId) {
  // Save unit per-exercise in state
  if (!ST.exUnits) ST.exUnits = {};
  ST.exUnits[exId] = u;
  saveState();

  // Only touch the card for this exercise
  const card = document.getElementById('exc-' + exId);
  if (!card) return;

  // Update all unit selects in this card
  card.querySelectorAll('.unit-sel').forEach(sel => { sel.value = u; });

  // Convert weight input values already typed in this card
  card.querySelectorAll('.weight-wrap .set-inp').forEach(inp => {
    const raw = parseFloat(inp.value);
    if (!isNaN(raw) && raw > 0) {
      const prevUnit = inp.dataset.unit || 'kg';
      if (prevUnit === u) return; // no change
      inp.value = u === 'lbs'
        ? Math.round(raw * 2.20462 * 10) / 10
        : Math.round(raw / 2.20462 * 100) / 100;
    }
    inp.dataset.unit = u;

    // Update placeholder
    const ph = parseFloat(inp.placeholder);
    if (!isNaN(ph) && ph > 0) {
      const prevU = inp.dataset.phUnit || 'kg';
      if (prevU !== u) {
        inp.placeholder = u === 'lbs'
          ? Math.round(ph * 2.20462 * 10) / 10
          : Math.round(ph / 2.20462 * 100) / 100;
        inp.dataset.phUnit = u;
      }
    }
  });

  // Update last-session reference pills in this card
  card.querySelectorAll('.ref-pill').forEach(pill => {
    pill.textContent = pill.textContent.replace(
      /(\d+\.?\d*)\s*(kg|lbs)/i,
      (_, num, fromUnit) => {
        if (fromUnit === u) return num + fromUnit;
        const n = parseFloat(num);
        return u === 'lbs'
          ? (Math.round(n * 2.20462 * 10) / 10) + 'lbs'
          : (Math.round(n / 2.20462 * 100) / 100) + 'kg';
      }
    );
  });
}


function getExUnit(exId) {
  return (ST.exUnits && ST.exUnits[exId]) || 'kg';
}
function toDisplayEx(kg, exId) {
  if (kg === '' || kg === null || kg === undefined) return '';
  const u = getExUnit(exId);
  return u === 'lbs' ? Math.round(parseFloat(kg) * 2.20462 * 10) / 10 : parseFloat(kg);
}
function toKgEx(val, exId) {
  if (val === '' || val === null || val === undefined) return '';
  const u = getExUnit(exId);
  return u === 'lbs' ? Math.round(parseFloat(val) / 2.20462 * 100) / 100 : parseFloat(val);
}

function toggleTheme() {
  ST.theme = ST.theme === 'dark' ? 'light' : 'dark';
  saveState();
  applyTheme();
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', ST.theme);
  document.getElementById('theme-btn').textContent = ST.theme === 'dark' ? '☀️' : '🌙';
}

// ── LAST SESSION REFERENCE ────────────────────────────
function getLastSets(exId) {
  const t = today();
  const dates = Object.keys(ST.logs).filter(d => d < t).sort().reverse();
  for (const d of dates) {
    const exLog = ST.logs[d].exercises?.[exId];
    if (exLog?.sets?.some(s => s.weight)) return exLog.sets;
  }
  return null;
}

// ── MISSED DAY LOGIC ──────────────────────────────────
function getMissedInfo() {
  const t = today();
  const todaySplit = getSplit(t);
  let missed = [];
  let check = new Date(t);
  check.setDate(check.getDate() - 1);
  for (let i = 0; i < 21; i++) {
    const dstr = ds(check);
    const sp = getSplit(dstr);
    if (sp === 'rest') { check.setDate(check.getDate() - 1); continue; }
    const log = ST.logs[dstr];
    if (log?.completed) break;
    missed.unshift({ date: dstr, split: sp });
    check.setDate(check.getDate() - 1);
  }
  if (!missed.length) return null;
  const count = missed.length;
  let rec = '', actionLabel = '';
  if (count === 1) {
    rec = `You missed ${SNAME[missed[0].split]} yesterday. Continue with today's ${SNAME[todaySplit]} as normal — one day off doesn't affect your strength.`;
    actionLabel = `Start: ${SHORT[todaySplit]}`;
  } else if (count <= 4) {
    rec = `You missed ${count} workouts (${missed.map(m => SHORT[m.split]).join(' → ')}). Pick up exactly where you left off with ${SNAME[todaySplit]}. No restart needed.`;
    actionLabel = `Continue: ${SHORT[todaySplit]}`;
  } else if (count <= 10) {
    rec = `You missed ${count} days. Reduce today's working weight by 15–20% to protect your joints. Continue from ${SNAME[todaySplit]}.`;
    actionLabel = `Go lighter: ${SHORT[todaySplit]}`;
  } else {
    rec = `You missed ${count} days. Start back at Day 1 (Push) with 50–60% of previous weights. Muscle memory means you'll be back to full strength in 2–3 weeks.`;
    actionLabel = 'Restart: Day 1 Push';
    return { count, rec, actionLabel, restart: true };
  }
  return { count, rec, actionLabel, restart: false };
}

function overrideSplit(val) {
  if (!val) return;
  document.getElementById('split-sel').value = '';
  if (val === getSplit(today())) { showToast('Already on that split'); return; }

  // Permanently shift startDate so the entire future schedule is correct
  // Find what index val is in the cycle, set startDate = today - that index
  const targetIdx = CYCLE.indexOf(val);
  if (targetIdx !== -1) {
    const newStart = new Date();
    newStart.setDate(newStart.getDate() - targetIdx);
    ST.startDate = ds(newStart);
    ST.todayOverride = null;
    ST.lastOverrideDate = null;
  } else {
    // rest day — just use override for today
    ST.todayOverride = val;
    ST.lastOverrideDate = today();
  }
  saveState();
  showToast(`Schedule set — today is ${SNAME[val]}`);
  renderHome();
}

// ════════════════════════════════════════════════════════
// SLIDER
// ════════════════════════════════════════════════════════
function renderSlider() {
  const t = today();
  const slider = document.getElementById('day-slider');
  let html = '';
  for (let offset = -3; offset <= 10; offset++) {
    const d = new Date(t);
    d.setDate(d.getDate() + offset);
    const dstr = ds(d);
    const split = getSplit(dstr);
    const col = SCOL[split];
    const log = ST.logs[dstr];
    const isToday = offset === 0;
    const isDone = log?.completed;
    const isMissed = offset < 0 && split !== 'rest' && !isDone;
    let cls = 'day-card';
    if (isToday) cls += ' is-today';
    else if (isDone) cls += ' is-done';
    else if (isMissed) cls += ' is-missed';
    const dayLbl = isToday ? 'Today' : offset === 1 ? 'Tomorrow' : offset === -1 ? 'Yesterday' : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const status = isDone ? '✓ Done' : isMissed ? '✗ Missed' : split === 'rest' ? 'Rest' : 'Scheduled';
    const statusCol = isDone ? 'var(--legs)' : isMissed ? 'var(--push)' : 'var(--ink3)';
    html += `<div class="${cls}" style="--split-color:${col}" onclick="sliderClick('${dstr}')">
      ${isToday ? '<div class="dc-today-badge">TODAY</div>' : ''}
      <div class="dc-day">${dayLbl}</div>
      <div class="dc-name" style="color:${split==='rest'?'var(--ink3)':col}">${SNAME[split]}</div>
      <div class="dc-status" style="color:${statusCol}">${status}</div>
    </div>`;
  }
  slider.innerHTML = html;
  setTimeout(() => {
    const tc = slider.children[3];
    if (tc) tc.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }, 60);
}

function sliderClick(dstr) {
  if (dstr === today()) {
    document.getElementById('ex-list').scrollIntoView({ behavior: 'smooth' });
  } else {
    openDayModal(dstr);
  }
}

// ════════════════════════════════════════════════════════
// HOME
// ════════════════════════════════════════════════════════
function renderHome() {
  renderSlider();
  const t = today();

  // Clear override if from previous day
  if (ST.lastOverrideDate && ST.lastOverrideDate !== t) {
    ST.todayOverride = null; ST.lastOverrideDate = null; saveState();
  }

  const split = getSplit(t);
  const exes = EX[split] || [];
  const log = getLog(t);

  // Sync UI controls
  document.getElementById('ov-current').textContent = SNAME[split];
  document.getElementById('split-sel').value = '';

  // Suggestion
  const miss = getMissedInfo();
  const sugBox = document.getElementById('suggest');
  if (miss) {
    document.getElementById('sug-text').textContent = miss.rec;
    const btn = document.getElementById('sug-btn');
    btn.textContent = miss.actionLabel;
    btn.onclick = () => {
      if (miss.restart) {
        // Restart: shift startDate so today = Day 1 (push)
        // Logs are preserved — only the schedule anchor changes
        ST.startDate = today();
        ST.todayOverride = null;
        ST.lastOverrideDate = null;
        // Do NOT clear logs, streak, sessions, or prs
        saveState();
        showToast('Schedule reset to Push Day. Your logs are safe.');
        renderHome();
      } else {
        sugBox.classList.remove('show');
      }
    };
    sugBox.classList.add('show');
  } else {
    sugBox.classList.remove('show');
  }

  // Stats
  const doneCount = exes.filter(e => log.exercises[e.id]?.done).length;
  document.getElementById('s-done').textContent = `${doneCount}/${exes.length}`;
  document.getElementById('s-streak').textContent = ST.streak;
  document.getElementById('s-total').textContent = ST.sessions;
  document.getElementById('sec-lbl').textContent = SNAME[split];

  const pct = exes.length ? Math.round((doneCount / exes.length) * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';

  const list = document.getElementById('ex-list');
  if (split === 'rest') {
    list.innerHTML = `<div class="rest-card"><div style="font-size:36px;margin-bottom:12px;">🛌</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Rest & Recovery</div><div style="font-size:13px;color:var(--ink3);line-height:1.6;">No workout today. Sleep 7–9 hrs. Hit your protein target (~0.8g per lb bodyweight). Come back stronger.</div></div>`;
    return;
  }
  list.innerHTML = exes.map(ex => buildCard(ex, log, t, split)).join('');
}

// ════════════════════════════════════════════════════════
// BUILD EXERCISE CARD
// ════════════════════════════════════════════════════════
function buildCard(ex, log, dateStr, split) {
  const exLog = log.exercises[ex.id] || { sets: [], feedback: null, done: false, failure: false };
  const isDone = exLog.done;
  const u = getExUnit(ex.id);
  const splitC = SCOL[split];

  // Last session reference
  const lastSets = getLastSets(ex.id);
  let refHtml = '';
  if (lastSets && lastSets.some(s => s.weight)) {
    const pills = lastSets.filter(s => s.weight || s.reps).map((s, i) => {
      // Use the unit that was stored with that set, or fallback to this ex's current unit
      const setUnit = s.unit || 'kg';
      const dw = s.weight ? (setUnit === 'lbs' ? Math.round(parseFloat(s.weight)*2.20462*10)/10 : parseFloat(s.weight)) : '?';
      const dispU = setUnit;
      return `<span class="ref-pill">S${i+1}: ${dw}${dispU} × ${s.reps || '?'}</span>`;
    }).join('');
    refHtml = `<div class="last-ref show"><div class="ref-lbl">Last session — your target to match or beat</div><div class="ref-pills">${pills}</div></div>`;
  }

  const defSets = parseInt(ex.target.split('×')[0].trim()) || 3;
  const setCount = Math.max(defSets, exLog.sets.length);
  const setRows = Array.from({ length: setCount }, (_, i) => {
    const s = exLog.sets[i] || { weight: '', reps: '' };
    const dw = s.weight !== '' && s.weight !== undefined ? toDisplay(s.weight) : '';
    const phW = lastSets?.[i]?.weight ? toDisplay(lastSets[i].weight) : u;
    const phR = lastSets?.[i]?.reps || 'reps';
    return `<div class="set-row">
      <div class="set-n">S${i+1}</div>
      <div class="weight-wrap">
        <input type="number" class="set-inp" inputmode="decimal" placeholder="${phW||'0'}" min="0" step="0.5" value="${dw}" onchange="saveSet('${dateStr}','${ex.id}',${i},'weight',this.value)">
        <select class="unit-sel" onchange="setUnit(this.value,'${ex.id}')">
          <option value="kg" ${u==='kg'?'selected':''}>kg</option>
          <option value="lbs" ${u==='lbs'?'selected':''}>lbs</option>
        </select>
      </div>
      <input type="number" class="set-inp" inputmode="numeric" placeholder="${phR}" min="1" step="1" value="${s.reps||''}" onchange="saveSet('${dateStr}','${ex.id}',${i},'reps',this.value)">
    </div>`;
  }).join('');

  const failChk = exLog.failure ? 'checked' : '';
  const fbMap = { easy: 'fb-easy', ok: 'fb-ok', hard: 'fb-hard' };

  return `<div class="ex-card ${isDone?'done':''}" id="exc-${ex.id}" style="--split-c:${splitC}">
    <div class="ex-top" onclick="toggleCard('${ex.id}')">
      <button class="ex-chk ${isDone?'done':''}" onclick="event.stopPropagation();toggleDone('${dateStr}','${ex.id}')">✓</button>
      <div class="ex-info">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-meta">${ex.target} · ${ex.muscles}</div>
      </div>
      <span class="ex-chev">›</span>
    </div>
    <div class="ex-body">
      <div class="ex-tabs">
        <button class="ex-tab active" onclick="switchTab('${ex.id}','howto',this)">How To</button>
        <button class="ex-tab" onclick="switchTab('${ex.id}','video',this)">Video</button>
        <button class="ex-tab" onclick="switchTab('${ex.id}','log',this)">Log Sets</button>
      </div>
      <div class="ex-tab-pane active" id="tp-howto-${ex.id}">
        <div class="howto-def">${ex.def}</div>
      </div>
      <div class="ex-tab-pane" id="tp-video-${ex.id}">
        <div class="yt-wrap" id="yt-${ex.id}" onclick="loadYT('${ex.id}','${ex.yt}')">
          <img class="yt-thumb" src="https://img.youtube.com/vi/${ex.yt}/mqdefault.jpg" alt="Exercise video thumbnail" loading="lazy">
          <div class="yt-play-btn">
            <div class="yt-play-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
        </div>
        <div class="yt-label">▶ Tap to play — YouTube tutorial for proper form</div>
      </div>
      <div class="ex-tab-pane" id="tp-log-${ex.id}">
        ${refHtml}
        <div class="sets-hd">
          <span class="shd"></span>
          <span class="shd">Weight</span>
          <span class="shd">Reps</span>
        </div>
        <div id="set-rows-${ex.id}">${setRows}</div>
        <button class="add-set" onclick="addSet('${dateStr}','${ex.id}')">+ Add Set</button>
        <div class="fail-row">
          <input type="checkbox" id="fail-${ex.id}" ${failChk} onchange="saveFailure('${dateStr}','${ex.id}',this.checked)">
          <label for="fail-${ex.id}" class="fail-lbl">Last set taken <strong>to failure</strong></label>
        </div>
        <div class="fb-sect">
          <div class="fb-lbl">How did this feel?</div>
          <div class="fb-row">
            <button class="fb-btn fb-easy ${exLog.feedback==='easy'?'sel':''}" onclick="saveFb('${dateStr}','${ex.id}','easy')">😊 Easy</button>
            <button class="fb-btn fb-ok ${exLog.feedback==='ok'?'sel':''}" onclick="saveFb('${dateStr}','${ex.id}','ok')">💪 Good</button>
            <button class="fb-btn fb-hard ${exLog.feedback==='hard'?'sel':''}" onclick="saveFb('${dateStr}','${ex.id}','hard')">🔥 Hard</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function switchTab(exId, tab, btn) {
  const tabs = ['howto', 'video', 'log'];
  tabs.forEach(t => {
    document.getElementById(`tp-${t}-${exId}`)?.classList.toggle('active', t === tab);
  });
  btn.closest('.ex-tabs').querySelectorAll('.ex-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function loadYT(exId, ytId) {
  const wrap = document.getElementById(`yt-${exId}`);
  wrap.innerHTML = `<iframe class="yt-iframe" src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
}

function toggleCard(id) {
  document.getElementById(`exc-${id}`).classList.toggle('open');
}

function saveSet(dateStr, exId, idx, field, val) {
  const exLog = getExLog(dateStr, exId);
  while (exLog.sets.length <= idx) exLog.sets.push({ weight: '', reps: '' });
  if (field === 'weight') {
    exLog.sets[idx].weight = val !== '' ? toKgEx(val, exId) : '';
    exLog.sets[idx].unit = getExUnit(exId); // store unit with the set
    if (parseFloat(val) > 0) {
      const kg = toKgEx(val, exId);
      const prev = parseFloat(ST.prs[exId]) || 0;
      if (kg > prev) {
        ST.prs[exId] = kg;
        showToast(`🏆 New PR: ${toDisplayEx(kg, exId)}${getExUnit(exId)}`);
      }
    }
  } else {
    exLog.sets[idx][field] = val;
  }
  saveState();
  if (dateStr === today()) updateStats();
}

function addSet(dateStr, exId) {
  const exLog = getExLog(dateStr, exId);
  const idx = exLog.sets.length;
  exLog.sets.push({ weight: '', reps: '' });
  saveState();
  const last = getLastSets(exId);
  const phW = last?.[idx]?.weight ? toDisplay(last[idx].weight) : '';
  const phR = last?.[idx]?.reps || 'reps';
  const container = document.getElementById(`set-rows-${exId}`);
  const div = document.createElement('div');
  div.className = 'set-row';
  div.style.cssText = '';
  div.innerHTML = `<div class="set-n">S${idx+1}</div>
    <div class="weight-wrap">
      <input type="number" class="set-inp" inputmode="decimal" placeholder="${phW||'0'}" min="0" step="0.5" onchange="saveSet('${dateStr}','${exId}',${idx},'weight',this.value)">
      <select class="unit-sel" onchange="setUnit(this.value,'${exId}')">
        <option value="kg" ${getExUnit(exId)==='kg'?'selected':''}>kg</option>
        <option value="lbs" ${getExUnit(exId)==='lbs'?'selected':''}>lbs</option>
      </select>
    </div>
    <input type="number" class="set-inp" inputmode="numeric" placeholder="${phR}" min="1" step="1" onchange="saveSet('${dateStr}','${exId}',${idx},'reps',this.value)">`;
  container.appendChild(div);
}

function saveFailure(dateStr, exId, checked) {
  const exLog = getExLog(dateStr, exId);
  exLog.failure = checked;
  saveState();
}

function saveFb(dateStr, exId, fb) {
  const exLog = getExLog(dateStr, exId);
  exLog.feedback = fb;
  saveState();
  const card = document.getElementById(`exc-${exId}`);
  if (card) {
    card.querySelectorAll('.fb-btn').forEach(b => b.classList.remove('sel'));
    const map = { easy: '.fb-easy', ok: '.fb-ok', hard: '.fb-hard' };
    card.querySelector(map[fb])?.classList.add('sel');
  }
}

function toggleDone(dateStr, exId) {
  const exLog = getExLog(dateStr, exId);
  exLog.done = !exLog.done;
  const split = getSplit(dateStr);
  const exes = EX[split] || [];
  const log = getLog(dateStr);
  const allDone = exes.every(e => log.exercises[e.id]?.done);
  if (allDone && !log.completed) {
    log.completed = true; ST.sessions++; ST.streak++;
    saveState(); showToast('🎉 Workout complete! Session saved.');
  } else { saveState(); }
  renderHome();
}

function updateStats() {
  const t = today(); const split = getSplit(t); const exes = EX[split] || [];
  const log = getLog(t);
  const done = exes.filter(e => log.exercises[e.id]?.done).length;
  const pct = exes.length ? Math.round((done / exes.length) * 100) : 0;
  document.getElementById('s-done').textContent = `${done}/${exes.length}`;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
}

// ════════════════════════════════════════════════════════
// CALENDAR
// ════════════════════════════════════════════════════════
let calY = new Date().getFullYear(), calM = new Date().getMonth();
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const COLS = {push:'var(--push)',pull:'var(--pull)',legs:'var(--legs)',upper:'var(--upper)',lower:'var(--lower)'};

function renderCalendar() {
  document.getElementById('cal-month').textContent = MONTHS[calM] + ' ' + calY;
  document.getElementById('cal-head').innerHTML = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cdh">${d}</div>`).join('');
  const first = new Date(calY, calM, 1).getDay();
  const days = new Date(calY, calM + 1, 0).getDate();
  const t = today();
  let html = '';
  for (let i = 0; i < first; i++) html += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= days; d++) {
    const dstr = `${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const split = getSplit(dstr);
    const log = ST.logs[dstr];
    const isToday = dstr === t;
    const isDone = log?.completed;
    const isMissed = dstr < t && split !== 'rest' && !isDone;
    const dotCol = isDone ? 'var(--legs)' : (COLS[split] || 'transparent');
    html += `<div class="cal-cell ${isToday?'today':''} ${isDone?'done':''} ${isMissed?'missed':''}" onclick="openDayModal('${dstr}')">
      <div class="cnum">${d}</div>
      ${split!=='rest'?`<div class="cdot" style="background:${dotCol}"></div>`:''}
      ${split!=='rest'?`<div class="cslbl" style="color:${isDone?'var(--legs)':COLS[split]||'var(--ink3)'}">${SHORT[split]||''}</div>`:''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
}
function calMove(dir) {
  calM += dir;
  if (calM > 11) { calM = 0; calY++; }
  if (calM < 0) { calM = 11; calY--; }
  renderCalendar();
}

// ════════════════════════════════════════════════════════
// DAY MODAL
// ════════════════════════════════════════════════════════
function openDayModal(dstr) {
  const split = getSplit(dstr);
  const log = ST.logs[dstr];
  const d = new Date(dstr + 'T12:00:00');
  const label = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const isPast = dstr < today();
  const isFuture = dstr > today();
  const col = SCOL[split];
  const u = unitLabel();

  let body = '';
  if (split === 'rest') {
    body = `<div class="dm-empty">🛌 Rest day — no workout scheduled.</div>`;
  } else if (isFuture) {
    const exes = EX[split] || [];
    body = `<div style="font-size:13px;color:var(--ink3);margin-bottom:12px;font-weight:500;">Scheduled — not yet completed.</div>`;
    body += exes.map(ex => `<div class="dm-ex"><div class="dm-exn">${ex.name}</div><div style="font-size:12px;color:var(--ink3)">${ex.target} · ${ex.muscles}</div></div>`).join('');
  } else if (!log || !Object.keys(log.exercises || {}).length) {
    body = `<div class="dm-empty">No log for this day.</div>`;
    const exes = EX[split] || [];
    body += `<div style="font-size:12px;color:var(--ink3);margin:10px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Scheduled workout:</div>`;
    body += exes.map(ex => `<div class="dm-ex"><div class="dm-exn">${ex.name}</div><div style="font-size:11px;color:var(--ink3)">${ex.target}</div></div>`).join('');
  } else {
    const exes = EX[split] || [];
    const fbC = { easy: 'var(--legs)', ok: 'var(--pull)', hard: 'var(--push)' };
    const fbL = { easy: '😊 Easy', ok: '💪 Good', hard: '🔥 Hard' };
    let totalVol = 0;
    body = exes.map(ex => {
      const exLog = log.exercises[ex.id];
      if (!exLog) return '';
      const hasSets = exLog.sets?.some(s => s.weight || s.reps);
      if (!hasSets && !exLog.done) return '';
      const vol = exLog.sets?.reduce((s, set) => s + (parseFloat(set.weight) || 0) * (parseInt(set.reps) || 0), 0) || 0;
      totalVol += vol;
      const dispVol = u === 'lbs' ? Math.round(vol * 2.20462) : Math.round(vol);
      const pills = (exLog.sets || []).filter(s => s.weight || s.reps).map((s, i) => {
        const isFail = exLog.failure && i === (exLog.sets.filter(x => x.weight || x.reps).length - 1);
        const setU = s.unit || 'kg';
        const dw = s.weight ? (setU === 'lbs' ? Math.round(parseFloat(s.weight)*2.20462*10)/10 : parseFloat(s.weight)) : '—';
        return `<span class="dm-pill ${isFail?'fail':''}">S${i+1}: ${dw}${s.weight?setU:''} × ${s.reps||'—'}${isFail?' 🔥':''}</span>`;
      }).join('');
      const fb = exLog.feedback;
      return `<div class="dm-ex">
        <div class="dm-exn">${ex.name} ${exLog.done?'✅':''}</div>
        ${fb?`<div class="dm-fb" style="background:${fbC[fb]}18;color:${fbC[fb]};border:1px solid ${fbC[fb]}30">${fbL[fb]}</div>`:''}
        <div class="dm-pills">${pills||'<span style="font-size:12px;color:var(--ink3)">No sets recorded</span>'}</div>
        ${vol>0?`<div class="dm-vol">Volume: ${dispVol}${u}</div>`:''}
      </div>`;
    }).filter(Boolean).join('');
    if (!body.trim()) body = `<div class="dm-empty">Session marked complete but no set data recorded.</div>`;
    if (totalVol > 0) {
      const dTotal = u === 'lbs' ? Math.round(totalVol * 2.20462) : Math.round(totalVol);
      body += `<div class="dm-total">Total session volume: <strong>${dTotal}${u}</strong></div>`;
    }
  }

  document.getElementById('modal').innerHTML = `
    <div class="mh">
      <div>
        <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;">${label}</div>
        <div class="mh-title" style="color:${col}">${SNAME[split]}</div>
        ${log?.completed?'<div style="font-size:12px;color:var(--legs);margin-top:2px;font-weight:600;">✓ Completed</div>':isPast&&split!=='rest'?'<div style="font-size:12px;color:var(--push);margin-top:2px;font-weight:600;">✗ Missed</div>':''}
      </div>
      <button class="mcl" onclick="closeModal()">✕</button>
    </div>
    <div class="mbody">${body}</div>`;
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-bg')) document.getElementById('modal-bg').classList.remove('open');
}

// ════════════════════════════════════════════════════════
// PROGRESS
// ════════════════════════════════════════════════════════
function renderProgress() {
  const allExes = []; const seen = new Set();
  Object.values(EX).forEach(arr => arr.forEach(e => { if (!seen.has(e.id)) { seen.add(e.id); allExes.push(e); } }));
  const pills = document.getElementById('pr-pills');
  const activeId = pills.querySelector('.prp.active')?.dataset.id || allExes[0]?.id;
  pills.innerHTML = allExes.map(e => `<button class="prp ${e.id===activeId?'active':''}" data-id="${e.id}" onclick="selectPr('${e.id}')">${e.name.split(' ').slice(0,3).join(' ')}</button>`).join('');
  renderPrChart(activeId);
}
function selectPr(id) {
  document.querySelectorAll('.prp').forEach(p => p.classList.toggle('active', p.dataset.id === id));
  renderPrChart(id);
}
function renderPrChart(exId) {
  let ex = null;
  Object.values(EX).forEach(arr => { const f = arr.find(e => e.id === exId); if (f) ex = f; });
  if (!ex) return;
  const u = unitLabel();
  const data = [];
  Object.entries(ST.logs).sort(([a],[b]) => a.localeCompare(b)).forEach(([date, log]) => {
    const exLog = log.exercises?.[exId];
    if (!exLog?.sets?.length) return;
    const maxKg = Math.max(...exLog.sets.map(s => parseFloat(s.weight) || 0));
    const volKg = exLog.sets.reduce((s, set) => s + (parseFloat(set.weight)||0)*(parseInt(set.reps)||0), 0);
    const reps = exLog.sets.reduce((s, set) => s + (parseInt(set.reps)||0), 0);
    const maxW = u === 'lbs' ? Math.round(maxKg*2.20462*10)/10 : maxKg;
    const vol = u === 'lbs' ? Math.round(volKg*2.20462) : Math.round(volKg);
    if (maxKg > 0 || reps > 0) data.push({ date, maxW, vol, reps, feedback: exLog.feedback, failure: exLog.failure });
  });
  const prKg = ST.prs[exId] || 0;
  const exU = getExUnit(exId);
  const prDisp = prKg ? (exU==='lbs'?Math.round(prKg*2.20462*10)/10:prKg) : '—';
  const maxW = data.length ? Math.max(...data.map(d => d.maxW)) : 0;
  let svgHtml = '';
  if (data.length >= 2) {
    const W=500,H=130,PL=34,PR=8,PT=18,PB=22;
    const cW=W-PL-PR, cH=H-PT-PB;
    const maxY = maxW*1.12||10;
    const pts = data.map((d,i) => ({ x: PL+(i/(data.length-1))*cW, y: PT+cH-(d.maxW/maxY)*cH, ...d }));
    const pathD = pts.map((p,i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const areaD = `${pathD} L${pts[pts.length-1].x.toFixed(1)},${(PT+cH).toFixed(1)} L${PL},${(PT+cH).toFixed(1)} Z`;
    const yVals = [0, maxW*0.5, maxW];
    const yLbls = yVals.map(v => `<text x="${PL-3}" y="${(PT+cH-(v/maxY)*cH+3.5).toFixed(1)}" fill="var(--ink3)" font-size="9" text-anchor="end" font-family="monospace">${Math.round(v)}</text>`).join('');
    svgHtml = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible">
      <defs>
        <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f0ff44" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#f0ff44" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+cH}" stroke="var(--border2)" stroke-width="1"/>
      <line x1="${PL}" y1="${PT+cH}" x2="${W-PR}" y2="${PT+cH}" stroke="var(--border2)" stroke-width="1"/>
      ${yLbls}
      <path d="${areaD}" fill="url(#ag)"/>
      <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)"/>
        <text x="${p.x.toFixed(1)}" y="${(p.y-8).toFixed(1)}" fill="var(--ink)" font-size="9" text-anchor="middle" font-family="monospace" font-weight="bold">${p.maxW}${u}</text>`).join('')}
    </svg>`;
  } else {
    svgHtml = `<div style="text-align:center;padding:28px;color:var(--ink3);font-size:13px;font-weight:500;">Log at least 2 sessions to see your chart.</div>`;
  }
  const fbC = { easy:'var(--legs)', ok:'var(--pull)', hard:'var(--push)' };
  const rows = data.length ? [...data].reverse().map(d => {
    const dl = new Date(d.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return `<tr>
      <td>${dl}</td>
      <td><strong style="font-family:'DM Mono',monospace">${d.maxW>0?d.maxW+u:'—'}</strong></td>
      <td style="font-family:'DM Mono',monospace">${d.reps>0?d.reps:'—'}</td>
      <td style="font-family:'DM Mono',monospace">${d.vol>0?d.vol+u:'—'}</td>
      <td>${d.failure?'<span style="color:var(--push);font-size:11px;font-weight:700">🔥 Yes</span>':'—'}</td>
      <td>${d.feedback?`<span style="color:${fbC[d.feedback]};font-weight:600">${d.feedback}</span>`:'—'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="6" style="text-align:center;color:var(--ink3);padding:20px;">No data yet — start logging!</td></tr>`;
  document.getElementById('pr-content').innerHTML = `
    <div class="chart-card">
      <div class="cc-title">${ex.name}</div>
      <div class="cc-sub">PR: ${prDisp}${prKg?exU:''} · ${data.length} session${data.length!==1?'s':''} logged</div>
      ${svgHtml}
    </div>
    <div class="chart-card" style="overflow-x:auto">
      <div class="cc-title" style="margin-bottom:10px">Session History</div>
      <table class="hist-tbl">
        <thead><tr><th>Date</th><th>Max weight</th><th>Reps</th><th>Volume</th><th>Failure</th><th>Feel</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ════════════════════════════════════════════════════════
// EXPORT / IMPORT
// ════════════════════════════════════════════════════════
function exportData() {
  const a = document.createElement('a');
  a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(ST, null, 2));
  a.download = `lift-backup-${today()}.json`;
  a.click();
  showToast('✓ Backup saved');
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const p = JSON.parse(ev.target.result);
      if (p.logs && p.startDate) { ST = p; saveState(); renderHome(); showToast('✓ Data imported'); }
      else showToast('⚠ Invalid backup file');
    } catch { showToast('⚠ Could not read file'); }
  };
  r.readAsText(f); e.target.value = '';
}

// ════════════════════════════════════════════════════════
// NAV + TOAST
// ════════════════════════════════════════════════════════
function goto(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.getElementById('pg-' + page).classList.add('active');
  btn.classList.add('active');
  if (page === 'home') renderHome();
  if (page === 'cal') renderCalendar();
  if (page === 'prog') renderProgress();
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
function showSyncStatus(status) {
  const dot = document.getElementById('sync-dot');
  if (!dot) return;
  const colors = { ok: '#00ff94', error: '#ff4d6d', offline: '#ff9500', syncing: '#f0ff44' };
  dot.style.background = colors[status] || 'var(--ink3)';
  dot.title = { ok: '✓ Synced to cloud', error: '✗ Sync failed — check console', offline: '⚠ Offline — saved locally', syncing: '↑ Syncing...' }[status] || '';
}

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
loadState().then(data => {
  ST = data;
  applyTheme();
  renderHome();
  // Show sync status on load
  showSyncStatus('ok');
});
</script>
